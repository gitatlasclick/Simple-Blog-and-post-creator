{% extends 'base.html' %}

{% block title %}ایجاد پست جدید - وبلاگ من{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="card p-8">
        <div class="text-center mb-8">
            <div class="text-4xl mb-3">✍️</div>
            <h1 class="text-3xl font-bold text-gray-800">ایجاد پست جدید</h1>
            <p class="text-gray-600 mt-2">نوشته جدید خود را با دیگران به اشتراک بگذارید</p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div>
                <label for="{{ form.title.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-heading ml-1"></i>عنوان پست
                </label>
                {{ form.title }}
            </div>
            <div>
                <label for="{{ form.content.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-align-left ml-1"></i>محتوا
                </label>
                {{ form.content }}
            </div>
            <div class="flex items-center space-x-4 space-x-reverse">
                <button type="submit" class="btn-primary text-white px-6 py-3 rounded-lg flex-1">
                    <i class="fas fa-save ml-2"></i>ذخیره پست
                </button>
                <a href="{% url 'blog:home' %}" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors">
                    <i class="fas fa-times ml-2"></i>انصراف
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
