{% extends 'base.html' %}

{% block title %}ایجاد پست جدید - وبلاگ من{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <article class="glass-card p-8 animate-scale-in">
        <!-- Header -->
        <div class="text-center mb-10">
            <div class="inline-block mb-4">
                <div class="w-20 h-20 bg-gradient-to-br from-purple-600 via-pink-600 to-blue-600 rounded-3xl flex items-center justify-center mx-auto shadow-2xl animate-float">
                    <span class="text-4xl">✍️</span>
                </div>
            </div>
            <h1 class="text-3xl font-black text-gray-800 mb-3 bg-gradient-to-r from-purple-600 via-pink-600 to-blue-600 bg-clip-text text-transparent">
                ایجاد پست جدید
            </h1>
            <p class="text-gray-600">نوشته جدید خود را با دیگران به اشتراک بگذارید</p>
        </div>

        <!-- Form -->
        <form method="POST" class="space-y-8">
            {% csrf_token %}
            
            <!-- Title Field -->
            <div class="group">
                <label for="{{ form.title.id_for_label }}" class="block text-sm font-bold text-gray-700 mb-3 flex items-center">
                    <div class="w-8 h-8 bg-gradient-to-br from-purple-500 to-pink-500 rounded-lg flex items-center justify-center ml-2">
                        <i class="fas fa-heading text-white text-sm"></i>
                    </div>
                    عنوان پست
                </label>
                {{ form.title }}
            </div>
            
            <!-- Content Field -->
            <div class="group">
                <label for="{{ form.content.id_for_label }}" class="block text-sm font-bold text-gray-700 mb-3 flex items-center">
                    <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-cyan-500 rounded-lg flex items-center justify-center ml-2">
                        <i class="fas fa-align-left text-white text-sm"></i>
                    </div>
                    محتوا
                </label>
                {{ form.content }}
            </div>
            
            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 pt-6 border-t border-gray-200">
                <button type="submit" class="btn-gradient text-white px-8 py-4 rounded-xl flex-1 flex items-center justify-center space-x-3 space-x-reverse shadow-xl">
                    <i class="fas fa-save"></i>
                    <span class="font-bold">ذخیره پست</span>
                </button>
                <a href="{% url 'blog:home' %}" class="px-8 py-4 bg-gradient-to-r from-gray-200 to-gray-300 text-gray-700 rounded-xl flex items-center justify-center space-x-3 space-x-reverse hover:from-gray-300 hover:to-gray-400 transition-all duration-300 shadow-lg">
                    <i class="fas fa-times"></i>
                    <span class="font-bold">انصراف</span>
                </a>
            </div>
        </form>
    </article>
</div>

<style>
    /* Input Styles */
    input[type="text"], textarea {
        width: 100%;
        padding: 14px 18px;
        background: rgba(255, 255, 255, 0.7);
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 14px;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
        font-family: 'Vazirmatn', sans-serif;
        font-size: 15px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    
    input[type="text"]:focus, textarea:focus {
        background: rgba(255, 255, 255, 0.95);
        border-color: #667eea;
        box-shadow: 0 0 25px rgba(102, 126, 234, 0.4);
        outline: none;
        transform: translateY(-2px);
    }
    
    textarea {
        min-height: 200px;
        resize: vertical;
    }
    
    /* Label Hover Effect */
    .group:hover label {
        color: #667eea;
    }
</style>
{% endblock %}
